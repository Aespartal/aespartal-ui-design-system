<div class="playground-container" [class.sidebar-collapsed]="!isSidebarOpen()">
  <!-- Mobile Overlay -->
  <div class="mobile-overlay"
       [class.visible]="isMobileMenuOpen()"
       (click)="closeMobileMenu()">
  </div>

  <!-- Sidebar Component -->
  <app-sidebar
    [class.mobile-open]="isMobileMenuOpen()"
    [isOpen]="isSidebarOpen()"
    [currentSection]="currentSection()"
    [menuItems]="menuItems"
    (sectionSelected)="selectSection($event)"
    (toggleRequested)="toggleSidebar()">
  </app-sidebar>

  <!-- Main Content -->
  <div class="playground-main">
    <!-- Header Component -->
    <app-header
      [isDarkMode]="isDarkMode()"
      (themeToggled)="toggleTheme()"
      (menuToggled)="toggleSidebar()">
    </app-header>

    <!-- Content Area -->
    <main class="playground-content">
      @if (currentSection() === 'installation') {
        <app-installation></app-installation>
      }

      @if (currentSection() === 'buttons') {
        <app-buttons-demo></app-buttons-demo>
      }

      @if (currentSection() === 'badges') {
        <app-badges-demo></app-badges-demo>
      }

      @if (currentSection() === 'theming') {
        <app-theming-demo></app-theming-demo>
      }

      @if (currentSection() === 'events') {
        <app-events-demo
          [clickCount]="clickCount"
          (testClicked)="handleTestClick()">
        </app-events-demo>
      }
    </main>
  </div>
</div>
